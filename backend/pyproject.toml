[project]
name = "backend"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.29.0",
    "pydantic==2.6.1",
    "python-multipart==0.0.9",
    "markdown==3.5.1",
    "python-dotenv==1.0.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.49",
    "pymysql==1.1.3",`n    "python-jose==3.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
